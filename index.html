<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kvarnby Basket P11 – Cup Statistik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #0d1f12;
      --green-card:   #122518;
      --green-border: #1e3d28;
      --green-mid:    #1f5c36;
      --green-accent: #2e8b57;
      --green-bright: #3cb371;
      --green-text:   #6fcf97;
      --red:          #fc8181;
      --gold:         #f6c90e;
      --fg:           #e2e8f0;
      --fg-muted:     #8aaa96;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--green-dark);
      color: var(--fg);
      min-height: 100vh;
    }

    /* ── Main app ───────────────────────────────────────── */

    header {
      background: linear-gradient(135deg, #0a1a0e, var(--green-card));
      border-bottom: 2px solid var(--green-accent);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header img.club-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    header .header-text h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--green-bright);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-style: italic;
    }
    header .header-text p {
      font-size: 0.7rem;
      color: var(--fg-muted);
      letter-spacing: 0.2em;
    }
    #refreshBtn {
      margin-left: auto;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--green-border);
      border-radius: 8px;
      color: var(--fg-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #refreshBtn:hover { border-color: var(--green-accent); color: var(--fg); }
    #refreshBtn .ball { display: inline-block; }
    #refreshBtn.spinning .ball { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .game-tabs {
      padding: 12px 24px 0;
      background: var(--green-dark);
    }
    .cup-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .cup-pill {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--green-border);
      background: var(--green-card);
      color: var(--fg-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cup-pill:hover { border-color: var(--green-accent); color: var(--fg); }
    .cup-pill.active {
      background: var(--green-accent);
      border-color: var(--green-accent);
      color: #fff;
    }
    .team-selector {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .team-pill {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--green-border);
      background: var(--green-card); color: var(--fg-muted);
      font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .team-pill:hover { border-color: var(--green-accent); color: var(--fg); }
    .team-pill.active { background: var(--green-mid); border-color: var(--green-accent); color: var(--green-text); }
    .view-selector { display: flex; gap: 6px; margin-bottom: 12px; }
    .view-pill {
      padding: 6px 16px; border-radius: 8px;
      border: 1px solid var(--green-border);
      background: var(--green-card); color: var(--fg-muted);
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em;
      cursor: pointer; transition: all 0.15s;
    }
    .view-pill:hover { border-color: var(--green-accent); color: var(--fg); }
    .view-pill.active { background: var(--green-accent); border-color: var(--green-accent); color: #fff; }

    .scope-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .scope-pill {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--green-border);
      background: var(--green-card); color: var(--fg-muted);
      font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .scope-pill:hover { border-color: var(--green-accent); color: var(--fg); }
    .scope-pill.active { background: var(--green-mid); border-color: var(--green-accent); color: var(--green-text); }

    .season-wrap { padding: 16px 24px 32px; background: var(--green-mid); border: 1px solid var(--green-border); border-top: none; }
    .season-panel {
      background: var(--green-card); border-radius: 10px; overflow: hidden;
      border: 1px solid var(--green-border);
    }
    .season-panel-header {
      padding: 10px 16px; font-weight: 700; font-size: 0.9rem;
      background: #0e2c1a; color: var(--green-text);
      border-bottom: 1px solid var(--green-border);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .season-scroll { overflow-x: auto; }
    .season-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .season-table th {
      padding: 6px 8px; background: #0a1a0e; color: var(--fg-muted);
      font-weight: 600; text-align: center; font-size: 0.72rem; white-space: nowrap;
    }
    .season-table th:first-child, .season-table td:first-child { text-align: left; }
    .season-table td { padding: 7px 8px; border-bottom: 1px solid var(--green-border); text-align: center; white-space: nowrap; }
    .season-table td:first-child { font-weight: 500; white-space: normal; }
    .season-table tbody tr:last-child td { border-bottom: none; }
    .season-table tbody tr:hover td { background: #1a3522; }
    .season-table .rank { color: var(--fg-muted); font-weight: 700; }
    .season-table .avg-cell { color: var(--fg); font-weight: 600; }
    .season-table .best-cell { color: var(--green-bright); font-weight: 600; }
    .season-table .total-row td {
      background: #0a1a0e; font-weight: 700; color: var(--green-bright);
      border-top: 2px solid var(--green-border);
    }
    .season-note { font-size: 0.72rem; color: var(--fg-muted); margin-top: 10px; }

    .share-row { display: flex; justify-content: center; margin: -4px 0 16px; }
    .share-btn {
      padding: 8px 18px; background: var(--green-mid); color: var(--fg);
      border: 1px solid var(--green-accent); border-radius: 8px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: background 0.15s;
    }
    .share-btn:hover { background: var(--green-accent); color: #fff; }
    .share-btn:disabled { opacity: 0.6; cursor: default; }

    .match-select-wrap { position: relative; padding-bottom: 0; }
    .match-select {
      width: 100%;
      padding: 10px 40px 10px 14px;
      background: var(--green-card);
      border: 1px solid var(--green-border);
      border-radius: 8px 8px 0 0;
      border-bottom: none;
      color: var(--fg);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .match-select:focus { border-color: var(--green-accent); }
    .match-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--fg-muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .game-content {
      padding: 0 24px 32px;
      background: var(--green-mid);
      border: 1px solid var(--green-border);
      border-top: none;
      display: none;
    }
    .game-content.active { display: block; }

    /* ── Score banner ───────────────────────────────────── */
    .score-banner {
      background: linear-gradient(135deg, #0a1a0e, var(--green-card));
      margin: 0 -24px 16px;
      border-bottom: 1px solid var(--green-border);
    }
    .match-header-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 24px 0;
      font-size: 0.75rem;
      color: var(--fg-muted);
      letter-spacing: 0.04em;
    }
    .match-header-meta .meta-date {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--fg);
    }
    .match-header-meta .meta-sep { color: var(--green-border); }
    .match-header-meta .meta-cup {
      background: var(--green-border);
      color: var(--green-text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0 20px;
    }
    .team-block { text-align: center; flex: 1; max-width: 280px; }
    .team-name { font-size: 1rem; font-weight: 700; color: var(--fg); margin-bottom: 4px; }
    .team-score { font-size: 3.5rem; font-weight: 800; line-height: 1; }
    .home-score { color: var(--green-text); }
    .away-score { color: var(--red); }
    .score-sep { font-size: 2.5rem; font-weight: 300; color: var(--green-border); padding: 0 16px; }

    .period-block { margin-bottom: 12px; }
    .period-block-label {
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 5px;
    }
    .period-block-label .pb-total { color: var(--green-border); letter-spacing: 0.04em; }
    .periods-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 0;
      font-size: 0.75rem;
      flex-wrap: wrap;
    }
    .period-chip {
      background: var(--green-card);
      border: 1px solid var(--green-border);
      border-radius: 4px;
      padding: 2px 8px;
      color: var(--fg-muted);
    }
    .fouls-row .period-chip { border-color: #5a2d2d; }

    /* ── Teams grid ─────────────────────────────────────── */
    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 700px) { .teams-grid { grid-template-columns: 1fr; } }

    .team-panel {
      background: var(--green-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--green-border);
    }
    .team-panel-header {
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .home-header { background: #0e2c1a; color: var(--green-text); border-bottom: 1px solid var(--green-border); }
    .away-header { background: #2c0e0e; color: var(--red); border-bottom: 1px solid #5a2d2d; }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .stats-table th {
      padding: 6px 10px;
      background: #0a1a0e;
      color: var(--fg-muted);
      font-weight: 600;
      text-align: center;
      font-size: 0.75rem;
    }
    .stats-table th:first-child { text-align: left; }
    .stats-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--green-border);
      text-align: center;
    }
    .stats-table td:first-child { text-align: left; font-weight: 500; }
    .stats-table tr:last-child td { border-bottom: none; }
    .home-panel .stats-table tr:hover td { background: #1a3522; }
    .away-panel .stats-table tr:hover td { background: #2c1515; }
    .stats-table .total-row td {
      background: #0a1a0e;
      font-weight: 700;
      color: var(--green-bright);
      border-top: 2px solid var(--green-border);
    }
    .away-panel .stats-table .total-row td { color: var(--red); }
    .away-panel .stats-table th { background: #1a0a0a; }
    .away-panel .stats-table td { border-bottom-color: #3d1f1f; }

    .pts-cell { font-weight: 700; color: var(--gold); }
    .one-pt   { color: #90cdf4; }
    .two-pt   { color: var(--green-text); }
    .three-pt { color: var(--green-bright); }
    .foul-cell { color: var(--red); font-weight: 600; }

    /* ── Event timeline ─────────────────────────────────── */
    .event-timeline {
      margin-top: 20px; background: #000;
      border-radius: 8px; overflow: hidden;
      border: 1px solid #1a1a1a;
    }
    .event-timeline-title {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: #555; padding: 10px 12px 0;
    }
    .tl-names {
      display: flex; align-items: center; padding: 6px 12px 8px;
      border-bottom: 1px solid #1a1a1a; font-size: 0.7rem; font-weight: 700;
    }
    .tl-period { margin-bottom: 0; }
    .tl-period-divider {
      display: flex; align-items: center; gap: 0;
      background: #111; border-top: 1px solid #222; border-bottom: 1px solid #222;
      padding: 6px 12px; margin-top: 2px;
    }
    .tl-period-tag {
      font-size: 0.72rem; font-weight: 900; letter-spacing: 0.1em;
      color: #fff; background: #222; border-radius: 4px;
      padding: 2px 8px; text-align: center; flex-shrink: 0;
    }
    .tl-period-pts-home {
      flex: 1; text-align: right; padding-right: 10px;
      font-size: 0.78rem; font-weight: 700; color: var(--green-text);
    }
    .tl-period-pts-away {
      flex: 1; text-align: left; padding-left: 10px;
      font-size: 0.78rem; font-weight: 700; color: var(--red);
    }
    .tl-period-fouls { color: #666; font-weight: 600; font-size: 0.72rem; }
    .tl-row {
      display: flex; align-items: center; gap: 0;
      padding: 4px 12px; border-bottom: 1px solid #0d0d0d; font-size: 0.78rem;
    }
    .tl-row:last-child { border-bottom: none; }
    .tl-home {
      flex: 1; text-align: right; padding-right: 8px;
      color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tl-away {
      flex: 1; text-align: left; padding-left: 8px;
      color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tl-row.home-ev .tl-home { color: var(--green-text); font-weight: 600; }
    .tl-row.away-ev .tl-away { color: var(--red); font-weight: 600; }
    .tl-score {
      min-width: 58px; text-align: center; flex-shrink: 0;
      font-size: 0.7rem; font-weight: 700; color: #666;
      background: #111; border-radius: 4px; padding: 2px 4px;
    }
    .ev-1pt { color: #90cdf4; font-weight: 700; }
    .ev-2pt { color: var(--green-text); font-weight: 700; }
    .ev-3pt { color: var(--green-bright); font-weight: 700; }
    .ev-foul { color: var(--red); font-weight: 700; }
    .ev-to   { color: #444; }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.73rem;
      color: var(--fg-muted);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--green-card);
      border-radius: 6px;
      border: 1px solid var(--green-border);
    }
    .legend span { display: flex; align-items: center; gap: 4px; }

    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--green-border);
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state p { font-size: 1rem; }
  </style>
</head>
<body>

<!-- ── Main app ──────────────────────────────────────────── -->
<div id="mainApp">
  <header>
    <img class="club-logo" src="logo.png" alt="Kvarnby" onerror="this.style.display='none'">
    <div class="header-text">
      <h1>Kvarnby Basket P11</h1>
    </div>
    <button type="button" id="refreshBtn" title="Uppdatera matchdata"><span class="ball">🏀</span> Uppdatera</button>
  </header>

  <div class="game-tabs" id="gameTabs"></div>

  <div id="gameContents">
    <div class="empty-state">
      <div class="icon">🏀</div>
      <p>Inga matcher hittades</p>
    </div>
  </div>
</div>

<script src="matches.js"></script>
<script>
  // ── Persistent UI-val (localStorage) ──────────────────────────────────────
  const LS = {
    get(k)   { try { return localStorage.getItem(k); }  catch { return null; } },
    set(k,v) { try { localStorage.setItem(k, v); }       catch {} },
    del(k)   { try { localStorage.removeItem(k); }       catch {} },
  };

  // ── Djuplänk till match via #match=<id> ───────────────────────────────────
  let pendingHashMatchId = null;

  function readHashMatchId() {
    const m = (location.hash || '').match(/match=(\d+)/);
    return m ? m[1] : null;
  }

  function writeHashMatchId(matchId) {
    const desired = matchId ? '#match=' + matchId : '';
    if (desired === (location.hash || '')) return;
    history.replaceState(null, '', desired || location.pathname + location.search);
  }

  // Applicera ev. djuplänk: hitta matchen och ställ in cup/lag/match-index.
  function applyHashSelection() {
    if (!pendingHashMatchId || !games.length) return;
    const gi = games.findIndex(g => String(getMatchId(g.data)) === pendingHashMatchId);
    if (gi >= 0) {
      if (games[gi].cup) activeCup = games[gi].cup;
      activeTeamId = games[gi].teamId ? String(games[gi].teamId) : null;
      activeView = 'matches';
      activeMatchIdx = gi;
    }
    pendingHashMatchId = null;
  }

  window.addEventListener('hashchange', () => {
    const id = readHashMatchId();
    if (!id || id === String(activeMatchId())) return;
    pendingHashMatchId = id;
    applyHashSelection();
    render();
  });

  function activeMatchId() {
    return (activeMatchIdx != null && games[activeMatchIdx])
      ? getMatchId(games[activeMatchIdx].data) : null;
  }

  // ── API ────────────────────────────────────────────────────────────────────
  function buildQuery(matchId) {
    return `Match({id:${matchId}}){home:{team:{club:{nation:{}},statistics:{}}},away:{team:{club:{nation:{}},statistics:{}}},feed:{statistics:{},events:[{}]},result:{}}`;
  }

  function flagEmoji(code) {
    if (!code || code.length !== 2) return '';
    return [...code.toUpperCase()].map(c =>
      String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)
    ).join('');
  }

  async function callApi(query, baseUrl, tournamentId) {
    const apiUrl = `${baseUrl}?call=${encodeURIComponent(query)}&lang=en&tournamentId=${tournamentId}`;
    const proxy  = window.MATCH_CONFIG?.proxy;
    const url    = proxy ? `${proxy}?url=${encodeURIComponent(apiUrl)}` : apiUrl;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  async function fetchMatch(matchId, baseUrl, tournamentId) {
    return callApi(buildQuery(matchId), baseUrl, tournamentId);
  }

  const _teamCache = {};
  async function fetchTeamMatchIds(teamId, baseUrl, tournamentId) {
    const cKey = `${teamId}_${tournamentId}`;
    const cached = _teamCache[cKey];
    if (cached && Date.now() - cached.ts < 5 * 60 * 1000) return cached.val;

    const query = `Team({id:${teamId}}){matches:[{home:{},away:{},result:{}}]}`;
    const data  = await callApi(query, baseUrl, tournamentId);
    const ids   = new Set();
    let teamName = `Lag ${teamId}`;
    for (const [key, val] of Object.entries(data.responses || {})) {
      const m = key.match(/^Match\(\{id:(\d+)\}\)$/);
      if (m) ids.add(parseInt(m[1]));
      if (key === `Team({id:${teamId}})` && val.entity?.__typename === 'Team') {
        teamName = val.entity.name?.clubName || val.entity.name?.fullName || teamName;
      }
    }
    const result = { ids: [...ids], teamName };
    _teamCache[cKey] = { val: result, ts: Date.now() };
    return result;
  }

  function getMatchId(data) {
    for (const key of Object.keys(data.responses || {})) {
      const m = key.match(/^Match\(\{id:(\d+)\}\)$/);
      if (m) return parseInt(m[1]);
    }
    return null;
  }

  function anyMatchLive() {
    const now = Date.now();
    for (const g of games) {
      for (const [key, val] of Object.entries(g.data?.responses || {})) {
        if (/^Match\(\{id:\d+\}\)$/.test(key) && val.entity?.__typename === 'Match') {
          const { finished, start, duration } = val.entity;
          if (finished) continue;
          // Inte klar + startar inom 30 min eller har redan börjat
          const startsWithin30min = start && (start - now) < 30 * 60 * 1000;
          const probablyOngoing   = start && now >= start && now <= start + (duration || 5400000) + 30 * 60 * 1000;
          if (startsWithin30min || probablyOngoing) return true;
        }
      }
    }
    return false;
  }

  async function buildFetchList(config) {
    const list = [];
    for (const cup of (config?.cups || [])) {
      for (const m of (cup.matches || [])) {
        list.push({ id: m.id, name: m.name || null, cup: cup.name, baseUrl: cup.baseUrl, tournamentId: cup.tournamentId, teamId: null, teamName: null });
      }
      for (const teamId of (cup.teamIds || [])) {
        try {
          const { ids, teamName } = await fetchTeamMatchIds(teamId, cup.baseUrl, cup.tournamentId);
          for (const id of ids) {
            if (!list.find(m => m.id === id))
              list.push({ id, name: null, cup: cup.name, baseUrl: cup.baseUrl, tournamentId: cup.tournamentId, teamId, teamName });
          }
        } catch (e) {
          console.warn(`Lag ${teamId} misslyckades:`, e.message);
        }
      }
    }
    return list;
  }

  function getMatchStart(data) {
    for (const [key, val] of Object.entries(data.responses || {})) {
      if (/^Match\(\{id:\d+\}\)$/.test(key) && val.entity?.__typename === 'Match') {
        return val.entity.start || 0;
      }
    }
    return 0;
  }

  function extractMatchName(data) {
    let home = '', away = '';
    for (const [key, val] of Object.entries(data.responses || {})) {
      if (val.entity?.__typename !== 'MatchActor') continue;
      const name = val.entity.name?.sv || val.entity.name?.en || '';
      if (!name) continue;
      if (key.includes('"home"') || key.includes('actor:"home"')) home = name;
      if (key.includes('"away"') || key.includes('actor:"away"')) away = name;
    }
    return home && away ? `${home} – ${away}` : null;
  }

  function getActiveConfig() {
    return window.MATCH_CONFIG;
  }

  async function loadAllMatches(silent = false) {
    const config    = getActiveConfig();
    const contentsEl = document.getElementById('gameContents');
    const tabsEl    = document.getElementById('gameTabs');
    const refreshBtn = document.getElementById('refreshBtn');

    if (refreshBtn) refreshBtn.classList.add('spinning');
    if (!silent) {
      tabsEl.innerHTML = '';
      contentsEl.innerHTML = `<div class="empty-state"><div class="icon" style="font-size:2rem">⏳</div><p>Hämtar matchdata…</p></div>`;
    }

    const toFetch = await buildFetchList(config);

    if (!toFetch.length) {
      if (refreshBtn) refreshBtn.classList.remove('spinning');
      // Team-discovery misslyckades (CORS/fil://) — ladda cachad data istället
      if (config?.cups?.length) {
        loadFromCache(contentsEl);
      } else {
        contentsEl.innerHTML = `<div class="empty-state"><div class="icon">⚙️</div><p>Ingen match-konfiguration. Kontrollera att matches.js är laddad.</p></div>`;
      }
      return;
    }

    const results = await Promise.allSettled(
      toFetch.map(m => fetchMatch(m.id, m.baseUrl, m.tournamentId))
    );

    if (refreshBtn) refreshBtn.classList.remove('spinning');

    games.length = 0;
    for (let i = 0; i < results.length; i++) {
      const r = results[i];
      if (r.status === 'fulfilled') {
        const m    = toFetch[i];
        const name = m.name || extractMatchName(r.value) || `Match ${m.id}`;
        games.push({ name, cup: m.cup, teamId: m.teamId, teamName: m.teamName, baseUrl: m.baseUrl, tournamentId: m.tournamentId, data: r.value });
      } else {
        console.warn(`Match ${toFetch[i].id} misslyckades:`, r.reason);
      }
    }

    if (games.length === 0) { loadFromCache(contentsEl); return; }

    games.sort((a, b) => getMatchStart(a.data) - getMatchStart(b.data));
    render();
    scheduleRefresh();
  }

  function loadFromCache(contentsEl) {
    function populate() {
      const src = window.GAME_DATA || [];
      for (const g of src) {
        if (!games.find(x => x.name === g.name)) games.push(g);
      }
      if (games.length) {
        games.sort((a, b) => getMatchStart(a.data) - getMatchStart(b.data));
        render();
      } else {
        contentsEl.innerHTML = `<div class="empty-state"><div class="icon">❌</div>
          <p>Kunde inte hämta data från API:et (CORS/fil://).<br><br>
          Kör <code style="background:#0a1a0e;padding:2px 6px;border-radius:4px">node generate-data.js</code>
          för att spara senaste data lokalt och ladda om sidan.</p></div>`;
      }
    }

    if (window.GAME_DATA) {
      populate();
    } else {
      const s = document.createElement('script');
      s.src = 'jsons/data.js';
      s.onload = populate;
      s.onerror = () => {
        contentsEl.innerHTML = `<div class="empty-state"><div class="icon">❌</div>
          <p>Ingen cachad data hittades.<br><br>
          Kör <code style="background:#0a1a0e;padding:2px 6px;border-radius:4px">node generate-data.js</code>
          för att hämta matchdata och ladda om sidan.</p></div>`;
      };
      document.head.appendChild(s);
    }
  }

  // ── State ──────────────────────────────────────────────────────────────────
  const games = [];

  // ── Smart refresh: bara synlig match ──────────────────────────────────────
  let autoRefreshTimer = null;

  function scheduleRefresh() {
    clearTimeout(autoRefreshTimer);
    const proxy    = window.MATCH_CONFIG?.proxy;
    const interval = proxy && anyMatchLive() ? 10 * 1000 : 10 * 60 * 1000;
    autoRefreshTimer = setTimeout(refreshVisibleMatch, interval);
  }

  async function refreshVisibleMatch() {
    const idx = activeMatchIdx;
    const g   = (idx !== null) ? games[idx] : null;

    if (!g?.baseUrl) {
      // Ingen match vald eller saknar info — full refresh
      loadAllMatches(true);
      return;
    }

    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) refreshBtn.classList.add('spinning');

    try {
      const matchId = getMatchId(g.data);
      if (matchId) {
        const newData = await fetchMatch(matchId, g.baseUrl, g.tournamentId);
        games[idx].data = newData;

        // Uppdatera bara den aktiva panelen
        const panel = document.getElementById('gameContents')
          ?.querySelector(`.game-content[data-idx="${idx}"]`);
        if (panel) {
          const parsed = parseGame(newData);
          const tmp = document.createElement('div');
          tmp.innerHTML = renderGame(parsed, idx, true, g.cup);
          panel.replaceWith(tmp.firstElementChild);
        }
      }
    } catch (e) {
      console.warn('Refresh misslyckades:', e.message);
    }

    if (refreshBtn) refreshBtn.classList.remove('spinning');
    scheduleRefresh();
  }

  // ── API response parser ────────────────────────────────────────────────────
  function parseGame(data) {
    const responses = data.responses || {};
    let homeTeamName = 'Hemmalag';
    let awayTeamName = 'Bortalag';
    let homeFlag = '';
    let awayFlag = '';
    let matchDate = null;

    // Build entity lookup for href resolution
    const entityMap = {};
    for (const [key, val] of Object.entries(responses)) {
      if (val.entity) entityMap[key] = val.entity;
    }

    function getNationCode(actorEntity) {
      const team   = entityMap[actorEntity.team?.href];
      const club   = entityMap[team?.club?.href];
      const nation = entityMap[club?.nation?.href];
      return nation?.code || '';
    }

    const goals = [];
    const fouls = [];
    const events = [];

    for (const [key, val] of Object.entries(responses)) {
      const entity = val.entity;
      if (!entity) continue;

      // Match start time for date display
      if (/^Match\(\{id:\d+\}\)$/.test(key) && entity.__typename === 'Match') {
        if (!matchDate && entity.start) matchDate = new Date(entity.start);
      }

      // Team names + flags
      if (key.startsWith('MatchActor(') && entity.__typename === 'MatchActor') {
        const isHome = key.includes('"home"') || key.includes("actor:\"home\"");
        const isAway = key.includes('"away"') || key.includes("actor:\"away\"");
        const teamName = entity.name?.sv || entity.name?.en || '';
        const flag = flagEmoji(getNationCode(entity));
        if (isHome && teamName) { homeTeamName = teamName; homeFlag = flag; }
        if (isAway && teamName) { awayTeamName = teamName; awayFlag = flag; }
      }

      // Match date from MatchFeed (fallback)
      if (key.startsWith('MatchFeed(') && entity.__typename === 'MatchFeed') {
        if (!matchDate && entity.liveStartTime) matchDate = new Date(entity.liveStartTime);
      }

      if (!key.startsWith('MatchEvent(')) continue;

      // Goals
      if (entity.__typename === 'MatchGoal') {
        const g = {
          playerName: entity.playerName?.trim() || 'Okänd',
          playerNr: entity.playerNr,
          value: entity.value,
          side: entity.side,
          period: entity.period,
          homeScore: entity.homeScore,
          awayScore: entity.awayScore,
          time: entity.absoluteTime || 0,
        };
        goals.push(g);
        events.push({ type: 'goal', ...g });
      }

      // Fouls
      if (entity.__typename === 'MatchPlayerFoul') {
        const f = {
          playerName: entity.playerName?.trim() || 'Okänd',
          playerNr: entity.playerNr,
          side: entity.side,
          period: entity.period,
          foulType: entity.foulType,
          foulCount: (entity.playerFouls || []).length + 1,
          time: entity.absoluteTime || 0,
        };
        fouls.push(f);
        events.push({ type: 'foul', ...f });
      }

      // Timeouts
      if (entity.__typename === 'MatchTimeout') {
        events.push({
          type: 'timeout',
          side: entity.side,
          period: entity.period,
          time: entity.absoluteTime || 0,
        });
      }
    }

    let finalHome = 0, finalAway = 0;
    for (const g of goals) {
      if (g.homeScore > finalHome) finalHome = g.homeScore;
      if (g.awayScore > finalAway) finalAway = g.awayScore;
    }

    const periodScores = computePeriodScores(goals);
    const periodFouls  = computePeriodFouls(fouls);
    const statsFromApi = parseStatistics(responses);
    const homeStats = statsFromApi?.homeStats
      || buildPlayerStats(goals.filter(g => g.side === 'home'), fouls.filter(f => f.side === 'home'));
    const awayStats = statsFromApi?.awayStats
      || buildPlayerStats(goals.filter(g => g.side === 'away'), fouls.filter(f => f.side === 'away'));
    const homeEvents = events.filter(e => e.side === 'home');
    const awayEvents = events.filter(e => e.side === 'away');

    return { homeTeamName, awayTeamName, homeFlag, awayFlag, finalHome, finalAway, periodScores, periodFouls, homeStats, awayStats, matchDate, homeEvents, awayEvents };
  }

  function computePeriodScores(goals) {
    const sorted = [...goals].sort((a, b) => a.time - b.time);
    const periods = {};
    for (const g of sorted) {
      const p = g.period ?? 0;
      if (!periods[p]) periods[p] = { home: 0, away: 0 };
      if (g.side === 'home') periods[p].home += g.value;
      else periods[p].away += g.value;
    }
    return periods;
  }

  function computePeriodFouls(fouls) {
    const periods = {};
    for (const f of (fouls || [])) {
      const p = f.period ?? 0;
      if (!periods[p]) periods[p] = { home: 0, away: 0 };
      if (f.side === 'home') periods[p].home++;
      else if (f.side === 'away') periods[p].away++;
    }
    return periods;
  }

  function buildPlayerStats(goals, foulsArr) {
    const players = {};
    for (const g of goals) {
      const key = g.playerName;
      if (!players[key]) players[key] = { name: g.playerName, nr: g.playerNr, pt1: 0, pt2: 0, pt3: 0, fouls: 0 };
      if (g.value === 1) players[key].pt1++;
      else if (g.value === 2) players[key].pt2++;
      else if (g.value === 3) players[key].pt3++;
    }
    for (const f of foulsArr) {
      const key = f.playerName;
      if (!players[key]) players[key] = { name: f.playerName, nr: f.playerNr, pt1: 0, pt2: 0, pt3: 0, fouls: 0 };
      players[key].fouls++;
    }
    return Object.values(players).sort((a, b) => {
      const pa = a.pt1 + a.pt2 * 2 + a.pt3 * 3;
      const pb = b.pt1 + b.pt2 * 2 + b.pt3 * 3;
      return pb - pa;
    });
  }

  function parseStatistics(responses) {
    const sortPlayers = obj => Object.values(obj).sort((a, b) =>
      (b.pt1 + b.pt2 * 2 + b.pt3 * 3) - (a.pt1 + a.pt2 * 2 + a.pt3 * 3)
    );

    function addPlayer(map, p) {
      const key = p.name;
      if (!key) return;
      if (!map[key]) map[key] = { name: p.name, nr: p.shirtNr ?? 0, pt1: 0, pt2: 0, pt3: 0, fouls: 0 };
      map[key].pt1   += p.onePointers   || 0;
      map[key].pt2   += p.twoPointers   || 0;
      map[key].pt3   += p.threePointers || 0;
      map[key].fouls += (p.fouls || []).length;
    }

    // Hämta lag-hrefs tidigt (behövs för roster-merge)
    let homeTeamHref = null, awayTeamHref = null;
    for (const [key, val] of Object.entries(responses)) {
      if (val.entity?.__typename !== 'MatchActor') continue;
      const href = val.entity.team?.href;
      if (!href) continue;
      if (key.includes('"home"') || key.includes('actor:"home"')) homeTeamHref = href;
      if (key.includes('"away"') || key.includes('actor:"away"')) awayTeamHref = href;
    }

    function mergeRoster(map, teamHref) {
      if (!teamHref) return;
      const statsEntity = responses[`${teamHref}$statistics`]?.entity;
      for (const p of (statsEntity?.players || [])) {
        if (!p.name || map[p.name]) continue;
        map[p.name] = { name: p.name, nr: p.shirtNr ?? 0, pt1: 0, pt2: 0, pt3: 0, fouls: 0 };
      }
    }

    // Primär: MatchFeed$statistics (per period, för spelade matcher)
    for (const [key, val] of Object.entries(responses)) {
      if (!key.startsWith('MatchFeed') || !key.endsWith('$statistics')) continue;
      if (!val.entity?.periods) continue;
      const home = {}, away = {};
      for (const period of val.entity.periods) {
        for (const p of (period.home?.players || [])) addPlayer(home, p);
        for (const p of (period.away?.players || [])) addPlayer(away, p);
      }
      if (Object.keys(home).length || Object.keys(away).length) {
        mergeRoster(home, homeTeamHref);
        mergeRoster(away, awayTeamHref);
        return { homeStats: sortPlayers(home), awayStats: sortPlayers(away) };
      }
    }

    // Fallback: Team$statistics (hela lagregistret, även före match)
    function parseTeamStats(teamHref) {
      if (!teamHref) return [];
      const statsEntity = responses[`${teamHref}$statistics`]?.entity;
      if (!statsEntity?.players?.length) return [];
      const map = {};
      for (const p of statsEntity.players) addPlayer(map, p);
      return sortPlayers(map);
    }

    const homeStats = parseTeamStats(homeTeamHref);
    const awayStats = parseTeamStats(awayTeamHref);
    if (homeStats.length || awayStats.length) return { homeStats, awayStats };

    return null;
  }

  function formatDate(d) {
    if (!d) return null;
    return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatDateShort(d) {
    if (!d) return null;
    return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  }

  function formatTime(d) {
    if (!d) return null;
    return d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  let activeCup      = LS.get('kvarnby_cup')  || null;
  let activeTeamId   = LS.get('kvarnby_team') || null;
  let activeMatchIdx = null;
  let activeView     = LS.get('kvarnby_view') || 'matches';        // 'matches' | 'season'
  let seasonScope    = LS.get('kvarnby_season_scope') || 'cup';    // 'cup' | 'all'

  function render() {
    const tabsEl = document.getElementById('gameTabs');
    const contentsEl = document.getElementById('gameContents');

    if (games.length === 0) {
      tabsEl.innerHTML = '';
      contentsEl.innerHTML = `<div class="empty-state"><div class="icon">🏀</div><p>Inga matcher hittades</p></div>`;
      return;
    }

    applyHashSelection();

    const parsed = games.map(g => parseGame(g.data));

    // Get all cups from config (including empty ones)
    const config = getActiveConfig();
    const cupOrder = (config?.cups || []).map(c => c.name);
    const cupGroups = {};

    // Initialize all cups from config
    cupOrder.forEach(cup => {
      cupGroups[cup] = [];
    });

    // Add games to their respective cups
    parsed.forEach((p, i) => {
      const cup = games[i].cup || '';
      if (cup && cupGroups[cup]) {
        cupGroups[cup].push({ p, i });
      }
    });

    if (!activeCup || !cupGroups[activeCup]) activeCup = cupOrder[0];

    // Lag-filter: unika teamIds inom aktiv cup (bara om fler än ett)
    const cupGames  = cupGroups[activeCup] || [];
    const teamMap   = {};
    for (const { i } of cupGames) {
      const { teamId, teamName } = games[i];
      if (teamId && !teamMap[teamId]) teamMap[teamId] = teamName || `Lag ${teamId}`;
    }
    const teamIds = Object.keys(teamMap);
    if (!activeTeamId || !teamMap[activeTeamId]) activeTeamId = teamIds[0] || null;

    // View-pills (Matcher / Säsongsstatistik)
    const viewPillsHtml = `<div class="view-selector">
      <button type="button" class="view-pill${activeView === 'matches' ? ' active' : ''}" data-view="matches">Matcher</button>
      <button type="button" class="view-pill${activeView === 'season' ? ' active' : ''}" data-view="season">Säsongsstatistik</button>
    </div>`;

    // Cup selector pills
    const pillsHtml = cupOrder.length > 1
      ? `<div class="cup-selector">${cupOrder.map(cup =>
          `<button type="button" class="cup-pill${cup === activeCup ? ' active' : ''}" data-cup="${esc(cup)}">${esc(cup)}</button>`
        ).join('')}</div>`
      : '';

    // Lag-pills (bara om fler än ett lag i cupen)
    const teamPillsHtml = teamIds.length > 1
      ? `<div class="team-selector">${teamIds.map(tid =>
          `<button type="button" class="team-pill${tid === activeTeamId ? ' active' : ''}" data-team="${tid}">${esc(teamMap[tid])}</button>`
        ).join('')}</div>`
      : '';

    // Spara UI-val
    LS.set('kvarnby_cup', activeCup || '');
    if (activeTeamId) LS.set('kvarnby_team', activeTeamId); else LS.del('kvarnby_team');
    LS.set('kvarnby_view', activeView);
    LS.set('kvarnby_season_scope', seasonScope);

    function bindCommonPills() {
      tabsEl.querySelectorAll('.view-pill').forEach(pill => {
        pill.addEventListener('click', () => { activeView = pill.dataset.view; render(); });
      });
      tabsEl.querySelectorAll('.cup-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          activeCup = pill.dataset.cup; activeTeamId = null; activeMatchIdx = null; render();
        });
      });
      tabsEl.querySelectorAll('.team-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          activeTeamId = pill.dataset.team; activeMatchIdx = null; render();
        });
      });
      document.getElementById('refreshBtn').onclick = () => loadAllMatches(true);
    }

    // ── Säsongsvy ────────────────────────────────────────────────────────────
    if (activeView === 'season') {
      const scopePillsHtml = `<div class="scope-selector">
        <button type="button" class="scope-pill${seasonScope === 'cup' ? ' active' : ''}" data-scope="cup">Denna cup</button>
        <button type="button" class="scope-pill${seasonScope === 'all' ? ' active' : ''}" data-scope="all">Alla cuper</button>
      </div>`;
      tabsEl.innerHTML = viewPillsHtml
        + (seasonScope === 'cup' ? pillsHtml + teamPillsHtml : '')
        + scopePillsHtml;
      contentsEl.innerHTML = renderSeason(teamIds, teamMap);
      writeHashMatchId(null);
      bindCommonPills();
      tabsEl.querySelectorAll('.scope-pill').forEach(pill => {
        pill.addEventListener('click', () => { seasonScope = pill.dataset.scope; render(); });
      });
      return;
    }

    // ── Matchvy ──────────────────────────────────────────────────────────────
    // Filtrera matcher efter valt lag (om fler än ett)
    const filteredGames = teamIds.length > 1 && activeTeamId
      ? cupGames.filter(({ i }) => String(games[i].teamId) === String(activeTeamId))
      : cupGames;

    const visibleIndices = new Set(filteredGames.map(({ i }) => i));
    if (activeMatchIdx == null || !visibleIndices.has(activeMatchIdx)) {
      activeMatchIdx = filteredGames[0]?.i ?? null;
    }

    // Match dropdown
    const selectHtml = filteredGames.length > 0
      ? `<div class="match-select-wrap">
      <select class="match-select" id="matchSelect">
        ${filteredGames.map(({ p, i }) => {
          const dateStr = p.matchDate ? `${formatDateShort(p.matchDate)} ${formatTime(p.matchDate)}` : '';
          const label   = `${games[i].name}${dateStr ? '  ·  ' + dateStr : ''}`;
          return `<option value="${i}"${i === activeMatchIdx ? ' selected' : ''}>${label}</option>`;
        }).join('')}
      </select>
    </div>`
      : '';

    tabsEl.innerHTML = viewPillsHtml + pillsHtml + teamPillsHtml + selectHtml;

    // Render games or empty state
    if (filteredGames.length === 0) {
      contentsEl.innerHTML = `<div class="empty-state"><div class="icon">🏀</div><p>Inga matcher ännu för ${esc(activeCup)}</p></div>`;
    } else {
      contentsEl.innerHTML = filteredGames.map(({ p, i }) =>
        renderGame(p, i, i === activeMatchIdx, games[i].cup || '')
      ).join('');
    }

    writeHashMatchId(activeMatchId());

    const matchSelect = document.getElementById('matchSelect');
    if (matchSelect) {
      matchSelect.addEventListener('change', function () {
        activeMatchIdx = Number(this.value);
        contentsEl.querySelectorAll('.game-content').forEach(c => c.classList.remove('active'));
        contentsEl.querySelector(`.game-content[data-idx="${this.value}"]`).classList.add('active');
        writeHashMatchId(activeMatchId());
      });
    }

    contentsEl.querySelectorAll('.share-btn').forEach(btn => {
      btn.addEventListener('click', () => shareMatchImage(Number(btn.dataset.share), btn));
    });

    bindCommonPills();
  }

  function renderGame(g, idx, active, cup) {
    const periodFouls = g.periodFouls || {};
    const periodKeys = [...new Set([
      ...Object.keys(g.periodScores),
      ...Object.keys(periodFouls),
    ])].sort((a, b) => Number(a) - Number(b));
    const periodLabels = periodKeys.map(p => {
      const ps = g.periodScores[p] || { home: 0, away: 0 };
      return `<span class="period-chip">${periodLabel(Number(p))}: <b style="color:var(--green-text)">${ps.home}</b>–<b style="color:var(--red)">${ps.away}</b></span>`;
    }).join('');
    const foulLabels = periodKeys.map(p => {
      const pf = periodFouls[p] || { home: 0, away: 0 };
      return `<span class="period-chip">${periodLabel(Number(p))}: <b style="color:var(--green-text)">${pf.home}</b>–<b style="color:var(--red)">${pf.away}</b></span>`;
    }).join('');
    const totalFoulsHome = periodKeys.reduce((s, p) => s + (periodFouls[p]?.home || 0), 0);
    const totalFoulsAway = periodKeys.reduce((s, p) => s + (periodFouls[p]?.away || 0), 0);

    const cupLabel  = cup ? `<span class="meta-cup">${esc(cup)}</span>` : '';
    const dateLabel = g.matchDate ? `<span class="meta-date">${formatDate(g.matchDate)} ${formatTime(g.matchDate)}</span>` : '';

    const headerMeta = (dateLabel || cupLabel)
      ? `<div class="match-header-meta">${dateLabel}${dateLabel && cupLabel ? '<span class="meta-sep">·</span>' : ''}${cupLabel}</div>`
      : '';

    return `
<div class="game-content${active ? ' active' : ''}" data-idx="${idx}">
  <div class="score-banner">
    ${headerMeta}
    <div class="score-row">
      <div class="team-block">
        <div class="team-name">${g.homeFlag ? g.homeFlag + ' ' : ''}${esc(g.homeTeamName)}</div>
        <div class="team-score home-score">${g.finalHome}</div>
      </div>
      <div class="score-sep">–</div>
      <div class="team-block">
        <div class="team-name">${g.awayFlag ? g.awayFlag + ' ' : ''}${esc(g.awayTeamName)}</div>
        <div class="team-score away-score">${g.finalAway}</div>
      </div>
    </div>
  </div>
  <div class="share-row">
    <button type="button" class="share-btn" data-share="${idx}">📷 Dela resultat</button>
  </div>
  ${periodLabels ? `<div class="period-block">
    <div class="period-block-label">Poäng per period</div>
    <div class="periods-row">${periodLabels}</div>
  </div>` : ''}
  ${Object.keys(periodFouls).length ? `<div class="period-block">
    <div class="period-block-label">Fouls per period <span class="pb-total">(totalt ${totalFoulsHome}–${totalFoulsAway})</span></div>
    <div class="periods-row fouls-row">${foulLabels}</div>
  </div>` : ''}

  <div class="legend">
    <span><span style="color:var(--gold)">PTS</span> Totala poäng</span>
    <span><span class="one-pt">1PT</span> Frikast</span>
    <span><span class="two-pt">2PT</span> Tvåpoängare</span>
    <span><span class="three-pt">3PT</span> Trepoängare</span>
    <span><span class="foul-cell">Foul</span> </span>
  </div>

  <div class="teams-grid">
    ${renderTeamPanel(g.homeTeamName, g.homeFlag, g.homeStats, 'home')}
    ${renderTeamPanel(g.awayTeamName, g.awayFlag, g.awayStats, 'away')}
  </div>
  ${renderEventTimeline(g.homeEvents, g.awayEvents, g.homeTeamName, g.awayTeamName, g.periodScores, g.homeFlag, g.awayFlag, g.periodFouls)}
</div>`;
  }

  function periodLabel(p) {
    return p == 0 ? 'P1' : p == 1 ? 'P2' : p == 2 ? 'P3' : p == 3 ? 'P4' : `FT${p - 3}`;
  }

  function renderEventTimeline(homeEvents, awayEvents, homeTeam, awayTeam, periodScores, homeFlag, awayFlag, periodFouls) {
    const all = [...(homeEvents || []), ...(awayEvents || [])];
    if (!all.length) return '';

    const byPeriod = {};
    for (const e of all) {
      const p = e.period ?? 0;
      if (!byPeriod[p]) byPeriod[p] = [];
      byPeriod[p].push(e);
    }
    const periods = Object.keys(byPeriod).sort((a, b) => Number(b) - Number(a));

    return `<div class="event-timeline">
      <div class="event-timeline-title">Händelselogg</div>
      <div class="tl-names">
        <div class="tl-home" style="color:var(--green-text)">${homeFlag ? homeFlag + ' ' : ''}${esc(homeTeam)}</div>
        <div class="tl-score"></div>
        <div class="tl-away" style="color:var(--red)">${awayFlag ? awayFlag + ' ' : ''}${esc(awayTeam)}</div>
      </div>
      ${periods.map(p => {
        const evs = byPeriod[p].slice().sort((a, b) => b.time - a.time);
        const ps  = (periodScores || {})[p] || { home: 0, away: 0 };
        const pf  = (periodFouls  || {})[p] || { home: 0, away: 0 };
        return `<div class="tl-period">
          <div class="tl-period-divider">
            <div class="tl-period-pts-home">${ps.home} p <span class="tl-period-fouls">· ${pf.home} f</span></div>
            <div class="tl-period-tag">${periodLabel(Number(p))}</div>
            <div class="tl-period-pts-away"><span class="tl-period-fouls">${pf.away} f ·</span> ${ps.away} p</div>
          </div>
          ${evs.map(e => {
            const isHome = e.side === 'home';
            let cell = '', score = '';

            if (e.type === 'goal') {
              const ptCls = e.value === 1 ? 'ev-1pt' : e.value === 2 ? 'ev-2pt' : 'ev-3pt';
              const pt    = e.value === 1 ? '1pt' : e.value === 2 ? '2pt' : '3pt';
              cell  = `🏀 #${e.playerNr} ${esc(e.playerName)} <span class="${ptCls}">${pt}</span>`;
              score = `${e.homeScore}–${e.awayScore}`;
            } else if (e.type === 'foul') {
              const ft = e.foulType === 'personal' ? 'PF' : e.foulType === 'technical' ? 'TF' : e.foulType === 'unsportsmanlike' ? 'UF' : 'F';
              cell = `⚠ #${e.playerNr} ${esc(e.playerName)} <span class="ev-foul">${ft} (${e.foulCount})</span>`;
            } else if (e.type === 'timeout') {
              cell = `<span class="ev-to">⏸ Timeout</span>`;
            }

            return `<div class="tl-row ${isHome ? 'home-ev' : 'away-ev'}">
              <div class="tl-home">${isHome ? cell : ''}</div>
              <div class="tl-score">${score}</div>
              <div class="tl-away">${!isHome ? cell : ''}</div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>`;
  }

  function renderTeamPanel(teamName, flag, players, side) {
    const isHome = side === 'home';
    const headerClass = isHome ? 'home-header' : 'away-header';
    const totalPts   = players.reduce((s, p) => s + p.pt1 + p.pt2 * 2 + p.pt3 * 3, 0);
    const total1     = players.reduce((s, p) => s + p.pt1, 0);
    const total2     = players.reduce((s, p) => s + p.pt2, 0);
    const total3     = players.reduce((s, p) => s + p.pt3, 0);
    const totalFouls = players.reduce((s, p) => s + p.fouls, 0);

    const rows = players.map(p => {
      const pts = p.pt1 + p.pt2 * 2 + p.pt3 * 3;
      return `<tr>
        <td>#${p.nr ?? '?'} ${esc(p.name)}</td>
        <td class="pts-cell">${pts}</td>
        <td class="one-pt">${p.pt1 > 0 ? p.pt1 : '–'}</td>
        <td class="two-pt">${p.pt2 > 0 ? p.pt2 : '–'}</td>
        <td class="three-pt">${p.pt3 > 0 ? p.pt3 : '–'}</td>
        <td class="foul-cell">${p.fouls > 0 ? p.fouls : '–'}</td>
      </tr>`;
    }).join('');

    return `
<div class="team-panel ${isHome ? 'home-panel' : 'away-panel'}">
  <div class="team-panel-header ${headerClass}">
    <span>${flag ? flag + ' ' : ''}${esc(teamName)}</span>
    <span>${totalPts} poäng</span>
  </div>
  <table class="stats-table">
    <thead>
      <tr>
        <th>Spelare</th>
        <th>PTS</th>
        <th class="one-pt">1PT</th>
        <th class="two-pt">2PT</th>
        <th class="three-pt">3PT</th>
        <th class="foul-cell">FOUL</th>
      </tr>
    </thead>
    <tbody>
      ${rows}
      <tr class="total-row">
        <td>LAGTOTAL</td>
        <td class="pts-cell">${totalPts}</td>
        <td class="one-pt">${total1 > 0 ? total1 : '–'}</td>
        <td class="two-pt">${total2 > 0 ? total2 : '–'}</td>
        <td class="three-pt">${total3 > 0 ? total3 : '–'}</td>
        <td class="foul-cell">${totalFouls > 0 ? totalFouls : '–'}</td>
      </tr>
    </tbody>
  </table>
</div>`;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Vilken sida (home/away) är "vårt" lag i en match? ──────────────────────
  function getOurSide(data, teamId) {
    if (!teamId) return null;
    for (const [key, val] of Object.entries(data.responses || {})) {
      if (val.entity?.__typename !== 'MatchActor') continue;
      const href = val.entity.team?.href || '';
      const m = href.match(/id:(\d+)/);
      if (m && String(m[1]) === String(teamId)) {
        if (key.includes('"home"') || key.includes('actor:"home"')) return 'home';
        if (key.includes('"away"') || key.includes('actor:"away"')) return 'away';
      }
    }
    return null;
  }

  // ── Säsongsövergripande spelarstatistik ───────────────────────────────────
  function renderSeason(cupTeamIds, cupTeamMap) {
    let list, scopeLabel;
    if (seasonScope === 'all') {
      list = games.filter(g => g.teamId);
      scopeLabel = 'Alla cuper';
    } else {
      list = games.filter(g => {
        if (!g.teamId || g.cup !== activeCup) return false;
        if (cupTeamIds.length > 1 && String(g.teamId) !== String(activeTeamId)) return false;
        return true;
      });
      scopeLabel = activeCup + (cupTeamIds.length > 1 && cupTeamMap[activeTeamId]
        ? ' · ' + cupTeamMap[activeTeamId] : '');
    }

    const acc = {};
    let played = 0;
    for (const g of list) {
      const side = getOurSide(g.data, g.teamId);
      if (!side) continue;
      const p = parseGame(g.data);
      if ((p.homeEvents.length + p.awayEvents.length) === 0) continue;   // ospelad match
      played++;
      const stats = side === 'home' ? p.homeStats : p.awayStats;
      for (const pl of stats) {
        const pts = pl.pt1 + pl.pt2 * 2 + pl.pt3 * 3;
        const appeared = pts > 0 || pl.fouls > 0;
        const key = pl.name;
        if (!acc[key]) acc[key] = { name: pl.name, nr: pl.nr || 0, m: 0, pt1: 0, pt2: 0, pt3: 0, fouls: 0, best: 0 };
        const a = acc[key];
        if (pl.nr) a.nr = pl.nr;
        a.pt1 += pl.pt1; a.pt2 += pl.pt2; a.pt3 += pl.pt3; a.fouls += pl.fouls;
        if (appeared) a.m++;
        if (pts > a.best) a.best = pts;
      }
    }

    const rows = Object.values(acc)
      .map(a => ({ ...a, pts: a.pt1 + a.pt2 * 2 + a.pt3 * 3 }))
      .filter(a => a.pts > 0 || a.fouls > 0)
      .sort((x, y) => y.pts - x.pts || y.best - x.best || y.m - x.m);

    if (!rows.length) {
      return `<div class="season-wrap"><div class="empty-state" style="padding:60px 24px">
        <div class="icon">📊</div><p>Ingen spelad matchstatistik ännu för ${esc(scopeLabel)}</p></div></div>`;
    }

    const tPt1 = rows.reduce((s, r) => s + r.pt1, 0);
    const tPt2 = rows.reduce((s, r) => s + r.pt2, 0);
    const tPt3 = rows.reduce((s, r) => s + r.pt3, 0);
    const tF   = rows.reduce((s, r) => s + r.fouls, 0);
    const tPts = tPt1 + tPt2 * 2 + tPt3 * 3;

    const body = rows.map((r, idx) => `<tr>
      <td><span class="rank">${idx + 1}.</span> #${r.nr || '?'} ${esc(r.name)}</td>
      <td>${r.m}</td>
      <td class="pts-cell">${r.pts}</td>
      <td class="avg-cell">${r.m ? (r.pts / r.m).toFixed(1) : '–'}</td>
      <td class="one-pt">${r.pt1 || '–'}</td>
      <td class="two-pt">${r.pt2 || '–'}</td>
      <td class="three-pt">${r.pt3 || '–'}</td>
      <td class="foul-cell">${r.fouls || '–'}</td>
      <td class="best-cell">${r.best}</td>
    </tr>`).join('');

    return `<div class="season-wrap">
      <div class="season-panel">
        <div class="season-panel-header">
          <span>${esc(scopeLabel)}</span>
          <span>${played} matcher · ${tPts} p</span>
        </div>
        <div class="season-scroll">
          <table class="season-table">
            <thead><tr>
              <th>Spelare</th><th>M</th><th>PTS</th><th>Snitt</th>
              <th class="one-pt">1P</th><th class="two-pt">2P</th><th class="three-pt">3P</th>
              <th class="foul-cell">F</th><th>Bästa</th>
            </tr></thead>
            <tbody>
              ${body}
              <tr class="total-row">
                <td>LAGTOTAL</td><td>${played}</td><td class="pts-cell">${tPts}</td><td>–</td>
                <td class="one-pt">${tPt1 || '–'}</td><td class="two-pt">${tPt2 || '–'}</td>
                <td class="three-pt">${tPt3 || '–'}</td><td class="foul-cell">${tF || '–'}</td><td>–</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <p class="season-note">M = antal matcher spelaren gjorde poäng eller foul i. Bästa = flest poäng i en enskild match. Endast spelade matcher räknas.</p>
    </div>`;
  }

  // ── Dela resultat som bild ────────────────────────────────────────────────
  function loadImg(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = src;
    });
  }

  function fitText(ctx, text, maxWidth) {
    text = String(text);
    if (ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
    return t.trim() + '…';
  }

  function drawScorers(ctx, players, x, y, color) {
    const top = (players || [])
      .map(p => ({ nr: p.nr, name: p.name, pts: p.pt1 + p.pt2 * 2 + p.pt3 * 3 }))
      .filter(p => p.pts > 0)
      .sort((a, b) => b.pts - a.pts)
      .slice(0, 5);
    ctx.textAlign = 'left';
    ctx.fillStyle = color;
    ctx.font = '700 25px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Poänggörare', x, y);
    ctx.font = '500 24px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#cbd5e0';
    if (!top.length) { ctx.fillText('–', x, y + 40); return; }
    top.forEach((p, i) => {
      const ly = y + 42 + i * 36;
      ctx.textAlign = 'left';
      ctx.fillText(fitText(ctx, `#${p.nr || '?'} ${p.name}`, 300), x, ly);
      ctx.textAlign = 'right';
      ctx.fillText(String(p.pts), x + 360, ly);
    });
    ctx.textAlign = 'left';
  }

  async function shareMatchImage(idx, btn) {
    const gRec = games[idx];
    if (!gRec) return;
    const g = parseGame(gRec.data);
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Skapar bild…'; }

    try {
      const W = 1080, H = 1080;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a1a0e');
      grad.addColorStop(1, '#122518');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#2e8b57'; ctx.fillRect(0, 0, W, 12);

      const logo = await loadImg('logo.png').catch(() => null);
      let y = 96;
      if (logo) { ctx.drawImage(logo, W / 2 - 46, 46, 92, 92); y = 196; }

      ctx.textAlign = 'center';
      ctx.fillStyle = '#3cb371';
      ctx.font = '900 50px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('KVARNBY BASKET P11', W / 2, y);
      y += 44;

      ctx.fillStyle = '#8aaa96';
      ctx.font = '600 27px "Segoe UI", system-ui, sans-serif';
      const meta = [gRec.cup, g.matchDate ? formatDate(g.matchDate) : null].filter(Boolean).join('   ·   ');
      if (meta) { ctx.fillText(meta, W / 2, y); y += 62; } else { y += 30; }

      const colL = W * 0.27, colR = W * 0.73;
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '700 36px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(fitText(ctx, (g.homeFlag ? g.homeFlag + ' ' : '') + g.homeTeamName, W * 0.42), colL, y);
      ctx.fillText(fitText(ctx, (g.awayFlag ? g.awayFlag + ' ' : '') + g.awayTeamName, W * 0.42), colR, y);
      y += 128;

      ctx.font = '800 118px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#6fcf97'; ctx.fillText(g.finalHome, colL, y);
      ctx.fillStyle = '#fc8181'; ctx.fillText(g.finalAway, colR, y);
      ctx.fillStyle = '#1e3d28'; ctx.font = '300 78px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('–', W / 2, y - 18);
      y += 56;

      const pk = Object.keys(g.periodScores).sort((a, b) => Number(a) - Number(b));
      if (pk.length) {
        ctx.font = '600 24px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#8aaa96';
        ctx.fillText(pk.map(k => `${periodLabel(Number(k))} ${g.periodScores[k].home}–${g.periodScores[k].away}`).join('      '), W / 2, y);
        y += 30;
      }

      const pf = Object.keys(g.periodFouls || {}).sort((a, b) => Number(a) - Number(b));
      if (pf.length) {
        ctx.font = '500 21px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#5c7a68';
        ctx.fillText('Fouls  ' + pf.map(k => `${periodLabel(Number(k))} ${g.periodFouls[k].home}–${g.periodFouls[k].away}`).join('   '), W / 2, y + 4);
        y += 34;
      } else { y += 8; }

      ctx.strokeStyle = '#1e3d28'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(90, y); ctx.lineTo(W - 90, y); ctx.stroke();
      y += 48;

      drawScorers(ctx, g.homeStats, 100, y, '#6fcf97');
      drawScorers(ctx, g.awayStats, W / 2 + 40, y, '#fc8181');

      ctx.textAlign = 'center';
      ctx.fillStyle = '#4a6a56';
      ctx.font = '500 22px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('Kvarnby P11 · cup-statistik', W / 2, H - 44);

      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      if (!blob) throw new Error('toBlob gav null');
      const fname = `${g.homeTeamName}_${g.finalHome}-${g.finalAway}_${g.awayTeamName}.png`
        .replace(/[^\w.-]+/g, '_');
      const file = new File([blob], fname, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: `${g.homeTeamName} ${g.finalHome}–${g.finalAway} ${g.awayTeamName}`,
          });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      console.warn('Dela misslyckades:', e.message);
      alert('Kunde inte skapa bilden.');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '📷 Dela resultat'; }
    }
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  pendingHashMatchId = readHashMatchId();
  loadAllMatches();

</script>
</body>
</html>
